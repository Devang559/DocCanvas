name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -i

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -not -name "*unaligned*" \
            | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          cp "${{ steps.apk.outputs.apk_path }}" release/DocCanvas.apk

      - name: Enable KVM (for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run release APK on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            adb install release/DocCanvas.apk
            adb shell monkey -p <your.package.name> -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > release/logcat.txt
            adb shell am force-stop <your.package.name>

      - name: Upload logcat artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-logcat
          path: release/logcat.txt
          retention-days: 7

      - name: Compress APK to ZIP
        run: |
          cd release
          zip DocCanvas.zip DocCanvas.apk

      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-apk
          path: release/DocCanvas.apk
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-zip
          path: release/DocCanvas.zip
          retention-days: 30

      - name: Upload R8 missing rules (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: android/app/build/outputs/mapping/release/missing_rules.txt
          retention-days: 7