name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          # Discover sdkmanager
          SDK_MANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDK_MANAGER=$(command -v sdkmanager)
          fi
          for candidate in \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/tools/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/tools/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/tools/bin/sdkmanager"; do
            if [ -f "$candidate" ] && [ -z "$SDK_MANAGER" ]; then
              SDK_MANAGER="$candidate"
            fi
          done
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | $SDK_MANAGER --update || true
          yes | $SDK_MANAGER \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          yes | $SDK_MANAGER --licenses || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unaligned*" | head -1)
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Compress APK to ZIP
        run: |
          ZIP_PATH="${{ steps.apk.outputs.apk_path }}.zip"
          zip -j "$ZIP_PATH" "${{ steps.apk.outputs.apk_path }}"
          echo "ZIP created at: $ZIP_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: doccanvas-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: doccanvas-release-zip
          path: ${{ steps.apk.outputs.apk_path }}.zip
          retention-days: 30
