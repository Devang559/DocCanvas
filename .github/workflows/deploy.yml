name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
           node-version: 22
           cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -i

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -not -name "*unaligned*" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi

          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          cp "${{ steps.apk.outputs.apk_path }}" release/DocCanvas.apk

      - name: Compress APK to ZIP
        run: |
          cd release
          zip DocCanvas.zip DocCanvas.apk

      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-apk
          path: release/DocCanvas.apk
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-zip
          path: release/DocCanvas.zip
          retention-days: 30
