name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # IMPORTANT: Replace with your real applicationId
      PACKAGE_NAME: com.doccanvas

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v5


      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm


      # -----------------------------
      # Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # -----------------------------
      # Android SDK packages
      # -----------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools"


      # -----------------------------
      # Accept licenses
      # -----------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true


      # -----------------------------
      # Install npm dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci


      # -----------------------------
      # System information
      # -----------------------------
      - name: Check disk and memory
        run: |
          echo "===== DISK ====="
          df -h

          echo "===== MEMORY ====="
          free -h

          echo "===== JAVA ====="
          java -version

          echo "===== NODE ====="
          node --version

          echo "===== NPM ====="
          npm --version


      # -----------------------------
      # Stop Gradle daemon
      # -----------------------------
      - name: Stop Gradle daemon
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --stop || true


      # -----------------------------
      # Clean project
      # -----------------------------
      - name: Clean Gradle project
        run: |
          cd android
          chmod +x ./gradlew

          ./gradlew clean \
            --no-daemon \
            --max-workers=2


      # -----------------------------
      # Show Gradle version
      # -----------------------------
      - name: Check Gradle version
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --version


      # -----------------------------
      # Build release APK
      # -----------------------------
      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace


      # -----------------------------
      # Locate APK
      # -----------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |

          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -not -name "*unaligned*" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"

            echo "Searching all APK files..."
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found at:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # -----------------------------
      # Prepare release directory
      # -----------------------------
      - name: Prepare release
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.apk_path }}" \
             release/DocCanvas.apk


      # -----------------------------
      # Enable KVM
      # -----------------------------
      - name: Enable KVM
        run: |

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      # -----------------------------
      # Test APK on emulator
      # -----------------------------
      - name: Run release APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6

          script: |

            echo "Installing APK..."

            adb install release/DocCanvas.apk

            echo "Starting application..."

            adb shell monkey \
              -p "$PACKAGE_NAME" \
              -c android.intent.category.LAUNCHER 1

            echo "Waiting for application..."

            sleep 15

            echo "Capturing logcat..."

            adb logcat -d > release/logcat.txt

            echo "Stopping application..."

            adb shell am force-stop "$PACKAGE_NAME"


      # -----------------------------
      # Upload logcat
      # -----------------------------
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-logcat
          path: release/logcat.txt
          if-no-files-found: ignore
          retention-days: 7


      # -----------------------------
      # Create ZIP
      # -----------------------------
      - name: Compress APK
        run: |
          cd release
          zip DocCanvas.zip DocCanvas.apk


      # -----------------------------
      # Show files
      # -----------------------------
      - name: Show release files
        run: |
          echo "===== RELEASE FILES ====="
          ls -lh release/


      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-apk
          path: release/DocCanvas.apk
          if-no-files-found: error
          retention-days: 30


      # -----------------------------
      # Upload ZIP
      # -----------------------------
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-zip
          path: release/DocCanvas.zip
          if-no-files-found: error
          retention-days: 30


      # -----------------------------
      # Upload R8 rules if present
      # -----------------------------
      - name: Upload R8 missing rules
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 7