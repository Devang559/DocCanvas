name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # -----------------------------
      # 2. Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # -----------------------------
      # 3. Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # -----------------------------
      # 4. Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # -----------------------------
      # 5. Install required SDK
      # -----------------------------
      - name: Install Android SDK packages
        run: |
         sdkmanager --update || true
         sdkmanager \
         "platform-tools" \
         "platforms;android-35" \
         "build-tools;37.0.0"





      # -----------------------------
      # 6. Accept licenses
      # -----------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # -----------------------------
      # 7. Install npm dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # 8. Check environment
      # -----------------------------
      - name: Check environment
        run: |
          echo "Node:"
          node --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed Android platforms:"
          sdkmanager --list_installed | grep "platforms;android" || true

      # -----------------------------
      # 9. Build Release APK
      # -----------------------------
      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # -----------------------------
      # 10. Locate APK
      # -----------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -not -name "*unaligned*" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi

          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # 11. Rename APK
      # -----------------------------
      - name: Prepare release
        run: |
          mkdir -p release
          cp "${{ steps.apk.outputs.apk_path }}" release/DocCanvas.apk

      # -----------------------------
      # 12. Enable KVM
      # -----------------------------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # -----------------------------
      # 13. Test APK on emulator
      # -----------------------------
      - name: Run release APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install release/DocCanvas.apk

            adb shell monkey \
              -p com.doccanvas \
              -c android.intent.category.LAUNCHER 1

            sleep 15

            mkdir -p release
            adb logcat -d > release/logcat.txt

            adb shell am force-stop com.doccanvas

      # -----------------------------
      # 14. Upload logcat
      # -----------------------------
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-logcat
          path: release/logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------
      # 15. Create ZIP
      # -----------------------------
      - name: Compress APK
        run: |
          cd release
          zip DocCanvas.zip DocCanvas.apk

      # -----------------------------
      # 16. Show release files
      # -----------------------------
      - name: Show release files
        run: |
          echo "Release files:"
          ls -lh release/

      # -----------------------------
      # 17. Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-apk
          path: release/DocCanvas.apk
          if-no-files-found: error
          retention-days: 30

      # -----------------------------
      # 18. Upload ZIP
      # -----------------------------
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-zip
          path: release/DocCanvas.zip
          if-no-files-found: error
          retention-days: 30

      # -----------------------------
      # 19. Upload R8 missing rules
      # -----------------------------
      - name: Upload R8 missing rules
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 7