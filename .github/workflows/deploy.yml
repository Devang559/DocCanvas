name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          sdkmanager --update || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unaligned*" | head -1)
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Compress APK to ZIP
        run: |
          ZIP_PATH="${{ steps.apk.outputs.apk_path }}.zip"
          zip -j "$ZIP_PATH" "${{ steps.apk.outputs.apk_path }}"
          echo "ZIP created at: $ZIP_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-zip
          path: ${{ steps.apk.outputs.apk_path }}.zip
          retention-days: 30
