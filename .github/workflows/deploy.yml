name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # -----------------------------
      # Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # -----------------------------
      # Install Android SDK packages
      # -----------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.0.12077973"

      # -----------------------------
      # Accept Android SDK licenses
      # -----------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # -----------------------------
      # Install npm dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Build Release APK
      # -----------------------------
      - name: Build release APK
        run: |
          cd android

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # -----------------------------
      # Locate APK
      # -----------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*unaligned*" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"

            echo "Available build outputs:"
            find android/app/build/outputs -type f

            exit 1
          fi

          echo "APK found: $APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Rename APK
      # -----------------------------
      - name: Prepare APK
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.apk_path }}" release/DocCanvas.apk

          echo "Release APK:"
          ls -lh release/DocCanvas.apk

      # -----------------------------
      # Create GitHub Release
      # -----------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DocCanvas v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release/DocCanvas.apk