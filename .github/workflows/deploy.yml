name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (cmdline-tools + licenses)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install required SDK packages
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unaligned*" | head -1)
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Compress APK to ZIP
        run: |
          ZIP_PATH="${{ steps.apk.outputs.apk_path }}.zip"
          zip -j "$ZIP_PATH" "${{ steps.apk.outputs.apk_path }}"
          echo "ZIP created at: $ZIP_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: doccanvas-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: doccanvas-release-zip
          path: ${{ steps.apk.outputs.apk_path }}.zip
          retention-days: 30