name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # -----------------------------
      # Java
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # -----------------------------
      # Android SDK tools ONLY
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # -----------------------------
      # Install Android SDK packages
      # -----------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.0.12077973"

      # -----------------------------
      # Accept licenses
      # -----------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # -----------------------------
      # Install npm dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Verify Android SDK
      # -----------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo ""
          echo "Installed packages:"
          sdkmanager --list_installed

      # -----------------------------
      # Build Release APK
      # -----------------------------
      - name: Build release APK
        run: |
          cd android

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # -----------------------------
      # Locate APK
      # -----------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*unaligned*" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi

          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Prepare release folder
      # -----------------------------
      - name: Prepare release
        run: |
          mkdir -p release
          cp "${{ steps.apk.outputs.apk_path }}" release/DocCanvas.apk

      # -----------------------------
      # Create ZIP
      # -----------------------------
      - name: Compress APK to ZIP
        run: |
          cd release
          zip DocCanvas.zip DocCanvas.apk

      # -----------------------------
      # Show release files
      # -----------------------------
      - name: Show release files
        run: |
          ls -lh release/

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-apk
          path: release/DocCanvas.apk
          if-no-files-found: error
          retention-days: 30

      # -----------------------------
      # Upload ZIP
      # -----------------------------
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: doccanvas-release-zip
          path: release/DocCanvas.zip
          if-no-files-found: error
          retention-days: 30